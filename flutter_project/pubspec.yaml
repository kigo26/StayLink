name: staylink_ai
description: "StayLink AI - Africa's Intelligent Real Estate, Roommate & Escrow Flutter Super-App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Suite for Persistent Core Data and Security Invariants
  firebase_core: ^2.15.0
  firebase_auth: ^4.7.0
  cloud_firestore: ^4.8.0

  # Navigation & State Management
  provider: ^6.0.5
  go_router: ^10.0.0

  # Payment, Networking & Utilities
  http: ^1.1.0
  uuid: ^3.0.7
  intl: ^0.18.1

  # Maps, Location & Visulization
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0

  # UI Design Enhancements
  cupertino_icons: ^1.0.5
  google_fonts: ^5.1.0
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
